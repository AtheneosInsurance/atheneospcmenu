// ─── Helpers ────────────────────────────────────────────────────────────────
function dName(app){return app.label||app.name;}
function ini(app){return dName(app).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function catName(cats,id,lang='en'){const c=cats.find(x=>x.id===id);if(!c)return id;return lang==='el'&&c.nameEl?c.nameEl:c.name;}
function catColor(cats,id){const c=cats.find(x=>x.id===id);return c?c.color:'#8a7f74';}

// ─── Tiny components ────────────────────────────────────────────────────────
function Logo({lang}){
  return React.createElement('div',{style:{display:'flex',alignItems:'center',gap:15}},
    React.createElement('img',{src:'data:image/jpeg;base64,'+LOGO,
      style:{height:54,width:'auto',objectFit:'contain'},alt:'Atheneos'}),
    React.createElement('div',{style:{width:2,height:42,background:'#d0c8c0'}}),
    React.createElement('div',{style:{fontSize:15,color:'#8a7f74',lineHeight:1.5,fontWeight:500}},TR[lang].appPortal)
  );
}

function LangToggle({lang,setLang}){
  return React.createElement('div',{style:{display:'flex',border:'2px solid #d0d0d0',borderRadius:3,overflow:'hidden'}},
    ['en','el'].map(l=>React.createElement('button',{key:l,onClick:()=>setLang(l),
      style:{padding:'4px 12px',background:l===lang?'#4a4340':'transparent',
        color:l===lang?'#fff':'#605e5c',border:'none',cursor:'pointer',
        fontSize:16,fontWeight:l===lang?600:400}},l==='en'?'EN':'ΕΛ'))
  );
}

function Swatch({color,size=14}){
  return React.createElement('span',{style:{display:'inline-block',width:size,height:size,
    borderRadius:4,background:color,border:'2px solid rgba(0,0,0,0.15)',flexShrink:0}});
}

function AppTile({app,cats,isFav,onFavToggle,compact,lang="en"}){
  const col=app.color||catColor(cats,app.catId);
  return React.createElement('div',{
    style:{background:'#fff',border:'2px solid #e0e0e0',borderRadius:6,
      padding:compact?'10px 8px':'16px 10px',cursor:'pointer',
      display:'flex',flexDirection:'column',alignItems:'center',gap:6,
      position:'relative',transition:'box-shadow 0.1s',minWidth:0},
    onMouseEnter:e=>{e.currentTarget.style.boxShadow='0 3px 12px rgba(0,0,0,0.13)';e.currentTarget.style.borderColor='#aaa'},
    onMouseLeave:e=>{e.currentTarget.style.boxShadow='none';e.currentTarget.style.borderColor='#e0e0e0'},
    onClick:()=>window.open(app.url,'_blank'),
  },
    React.createElement('div',{style:{width:compact?45:60,height:compact?45:60,borderRadius:9,
      background:col,display:'flex',alignItems:'center',justifyContent:'center',
      color:'#fff',fontWeight:700,fontSize:compact?16:20,flexShrink:0}},ini(app)),

// ─── GitHub Storage ──────────────────────────────────────────────────────────
// CONFIGURE THESE before deploying to GitHub Pages:
const GH = {
  owner:  'AtheneosInsurance',       // GitHub username
  repo:   'atheneospcmenu',         // repository name
  branch: 'main',
  token:  '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',         // Personal Access Token (repo scope)
  shared: 'data/shared.json',       // apps + categories
  users:  'data/users.json',        // per-user favourites + lang
};
// ─────────────────────────────────────────────────────────────────────────────

const GH_BASE = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents`;
const GH_HDR  = () => ({
  'Authorization': `token ${GH.token}`,
  'Accept':        'application/vnd.github.v3+json',
  'Content-Type':  'application/json',
});

// In-memory SHA cache (GitHub requires SHA for updates)
const _sha = {};

async function ghRead(file) {
  try {
    const r = await fetch(`${GH_BASE}/${file}?ref=${GH.branch}&t=${Date.now()}`, { headers: GH_HDR() });
    if (!r.ok) return { data: null, sha: null };
    const j = await r.json();
    const data = JSON.parse(atob(j.content.replace(/\s/g, '')));
    return { data, sha: j.sha };
  } catch(e) { return { data: null, sha: null }; }
}

async function ghWrite(file, data, sha) {
  const encode = d => btoa(unescape(encodeURIComponent(JSON.stringify(d, null, 2))));
  const attempt = async (currentSha) => {
    const body = {
      message: `portal update ${new Date().toISOString()}`,
      content: encode(data),
      branch:  GH.branch,
    };
    if (currentSha) body.sha = currentSha;
    const r = await fetch(`${GH_BASE}/${file}`, {
      method: 'PUT', headers: GH_HDR(), body: JSON.stringify(body)
    });
    if (r.status === 409 || r.status === 422) {
      // Stale SHA — fetch the latest and retry once
      const fresh = await ghRead(file);
      if (fresh.sha && fresh.sha !== currentSha) {
        return attempt(fresh.sha);
      }
    }
    if (!r.ok) { console.warn('ghWrite failed', r.status); return currentSha; }
    const j = await r.json();
    return j.content?.sha || currentSha;
  };
  try { return await attempt(sha); }
  catch(e) { console.warn('ghWrite error', e); return sha; }
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const[apps,    setApps]    = useState(INIT_APPS);
  const[cats,    setCats]    = useState(INIT_CATS);
  const[favIds,  setFavIds]  = useState([]);
  const[page,    setPage]    = useState('menu');
  const[lang,    setLang]    = useState('en');
  const[username,setUsername]= useState('');
  const[displayName,setDisplayName] = useState('');
  const[loaded,  setLoaded]  = useState(false);
  const[syncing, setSyncing] = useState(false);
  const[syncErr, setSyncErr] = useState(false);

  const saveTimer     = useRef(null);
  const userSaveTimer = useRef(null);

  // ── On mount: restore identity from localStorage ──────────────────────────
  useEffect(() => {
    const dn = localStorage.getItem('portal_displayName') || '';
    const un = localStorage.getItem('portal_username')    || '';
    if (dn && un) { setDisplayName(dn); setUsername(un); }
    // Load lang preference from localStorage too
    const savedLang = localStorage.getItem('portal_lang');
    if (savedLang) setLang(savedLang);
  }, []);

  // ── Load shared data (apps + cats) from GitHub ────────────────────────────
  useEffect(() => {
    ghRead(GH.shared).then(({ data, sha }) => {
      _sha.shared = sha;  // always store SHA even if null
      if (data?.apps?.length) setApps(data.apps);
      if (data?.cats?.length) setCats(data.cats);
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  // ── Load per-user prefs from GitHub when username is known ────────────────
  useEffect(() => {
    if (!username) return;
    ghRead(GH.users).then(({ data, sha }) => {
      if (sha) _sha.users = sha;
      const me = data?.[username];
      if (me?.favIds) setFavIds(me.favIds);
      if (me?.lang)   { setLang(me.lang); localStorage.setItem('portal_lang', me.lang); }
    });
  }, [username]);

  // ── Save shared (debounced 800ms) ─────────────────────────────────────────
  const saveShared = (newApps, newCats) => {
    clearTimeout(saveTimer.current);
    setSyncing(true);
    saveTimer.current = setTimeout(async () => {
      // Always fetch latest SHA before writing to avoid conflicts
      const { sha } = await ghRead(GH.shared);
      if (sha) _sha.shared = sha;
      _sha.shared = await ghWrite(GH.shared, { apps: newApps, cats: newCats, updatedAt: new Date().toISOString() }, _sha.shared);
      setSyncing(false);
    }, 800);
  };

  // ── Save user prefs (debounced 800ms) ─────────────────────────────────────
  const saveUser = (newFavIds, newLang) => {
    if (!username) return;
    clearTimeout(userSaveTimer.current);
    userSaveTimer.current = setTimeout(async () => {
      const { data, sha } = await ghRead(GH.users);
      if (sha) _sha.users = sha;
      const all = data || {};
      all[username] = { favIds: newFavIds, lang: newLang, displayName, lastSeen: new Date().toISOString() };
      _sha.users = await ghWrite(GH.users, all, _sha.users);
    }, 800);
  };

  const setAppsAndSave = v => { const n = typeof v==='function'?v(apps):v; setApps(n); saveShared(n, cats); };
  const setCatsAndSave = v => { const n = typeof v==='function'?v(cats):v; setCats(n); saveShared(apps, n); };
  const setLangAndSave = v => { setLang(v); localStorage.setItem('portal_lang', v); saveUser(favIds, v); };
  const toggle = id => {
    const n = favIds.includes(id) ? favIds.filter(x=>x!==id) : [...favIds, id];
    setFavIds(n); saveUser(n, lang);
  };
  const handleLogin = (dn, un) => { setDisplayName(dn); setUsername(un); };

  // ── Loading / login states ────────────────────────────────────────────────
  const spinner = msg => React.createElement('div', {
    style: { height:900, display:'flex', flexDirection:'column', alignItems:'center',
      justifyContent:'center', background:'#f3f0ec', border:'2px solid #c8c0b8',
      borderRadius:3, boxShadow:'0 6px 24px rgba(0,0,0,0.14)', gap:18 }
  },
    React.createElement('img', { src:'data:image/jpeg;base64,'+LOGO, style:{ height:54, opacity:0.5 }, alt:'' }),
    React.createElement('div', { style:{ fontSize:18, color:'#8a7f74' } }, msg)
  );

  if (!loaded) return spinner(lang==='el' ? 'Φόρτωση...' : 'Loading...');
  if (!username) return React.createElement(LoginScreen, { onLogin:handleLogin, lang, setLang });

  return React.createElement('div', {
    style: { height:900, display:'flex', flexDirection:'column', border:'2px solid #c8c0b8',
      borderRadius:3, overflow:'hidden', boxShadow:'0 6px 24px rgba(0,0,0,0.14)', background:'#f3f3f3' }
  },
    page==='menu'  && React.createElement(MainMenu,   { apps, cats, favIds, onFavToggle:toggle, onNav:setPage, lang, setLang:setLangAndSave, username, displayName }),
    page==='user'  && React.createElement(FavsPage,   { apps, cats, favIds, onFavToggle:toggle, onBack:()=>setPage('menu'), lang, setLang:setLangAndSave }),
    page==='admin' && React.createElement(AdminPage,  { apps, setApps:setAppsAndSave, cats, setCats:setCatsAndSave, onBack:()=>setPage('menu'), lang, setLang:setLangAndSave, syncing })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
